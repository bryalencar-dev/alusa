name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: true
      - name: Copy env
        run: cp .env.example .env
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit Tests
        run: pnpm test:unit -- --run
      - name: Build
        run: pnpm build
      - name: E2E Tests
        run: pnpm --filter @alusa/web test:e2e -- --reporter=line
        env:
          CI: true
